<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="description" content="Grand Hotel — деталі вашого бронювання."><title>Ваше бронювання — Grand Hotel</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161616'/%3E%3Cpath d='M9 8v16m14-16v16M9 16h14' stroke='%23C5A15A' stroke-width='3'/%3E%3C/svg%3E"><link rel="canonical" href="https://hotelos.webart.work/confirmation/"><link rel="stylesheet" href="/confirmation/confirmation.css"></head>
<body>
<header class="topbar">
 <div class="tb-logo"><span class="mark">G</span>Grand Hotel</div>
 <div class="demo-switch">
  <label for="demo-state">Демо: стан бронювання</label>
  <select id="demo-state">
   <option value="new">Щойно підтверджено</option>
   <option value="return" selected>Повторний перегляд</option>
   <option value="paid">Оплачено повністю</option>
   <option value="pending">Перевіряємо оплату</option>
   <option value="failed">Оплату не завершено</option>
   <option value="staying">Гість заселився</option>
   <option value="done">Проживання завершено</option>
   <option value="cancelled">Скасовано</option>
   <option value="invalid">Недійсне посилання</option>
  </select>
  <button class="btn secondary" id="btn-contact-top">Зв’язатися</button>
 </div>
</header>

<main id="main"></main>

<div class="sticky-pay" id="sticky-pay"></div>

<footer class="branding" id="branding">Працює на Hotel OS</footer>

<dialog id="details-dialog"><div class="dialog-head"><b>Grand Hotel</b><button class="btn secondary" id="dialog-close" style="min-height:30px;padding:6px 10px">✕</button></div><div id="dialog-content"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/assets/hotel-photos.js"></script>
<script src="/confirmation/confirmation.js"></script>
</body></html>
